# On-premises, on the LAN. The device pushes to the receiver over plain HTTP
# and cannot reach a cloud host (SPEC.md §14).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr}
      POSTGRES_DB: hr_attendance
    ports:
      # Loopback only. Nothing outside this host talks to the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_attendance"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://hr:${POSTGRES_PASSWORD:-hr}@db:5432/hr_attendance
    ports:
      # Reachable from the device's address on the LAN, and from nowhere else.
      # Never routed through the tunnel (SPEC.md §12).
      #
      # This port is half of the device's Cloud Server Setting, so it is a value
      # that has to be recorded and kept (SPEC.md §10). 8000 is taken on this
      # host by Production Tracking, which stays separate from this system.
      - "${RECEIVER_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
